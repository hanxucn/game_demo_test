card_rarity:
  # ADR-068：精英卡（橙卡）允许强于同费预算 —— 设计者明确"有些卡稍强是预期的"。
  # 这些卡的技能远超估值模型的表达能力，强行按模型改数值会做坏设计。
  shu_guanyu: elite      # 水淹七军：全体技能禁用 + 全体 1 伤
  wei_guohuai: elite     # 据守：相邻 +2 上限 + 相邻架盾
