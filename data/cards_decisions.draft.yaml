  # 手写稿只写了技能名「白毦兵」、正文区空白；与其留一条 pending 的空技能，
  # 不如先当**白板武将**进卡池，技能名等效果设计好再加回来。
  - shu_chendao
  # wei_caozhang「猛袭」已于 ADR-071 补上效果（抉择：抽 1 张 / 本回合攻击 +1），
