# 状态定义
# 详见 docs/gdd/10-skills-statuses.md §3
#
# 字段说明：
#   id          唯一标识
#   name        显示名（≤4 字）
#   kind        buff | debuff
#   numeric     是否数值型（true = 按层数累加；false = 标志型，不叠加）
#   scope       character | lord | both
#   timing      结算时机（对应 docs/gdd/10-skills-statuses.md §4 的时机编号）
#   duration    permanent | turns | until_consumed | conditional
#   memo        一句话说明

# ---------- 增益 ----------

- id: zhen_fen
  name: 振奋
  kind: buff
  numeric: true
  scope: character
  timing: 13            # 伤害结算：攻击力修正
  duration: permanent
  memo: "攻击 +N"

- id: ji_jiu
  name: 急救
  kind: buff
  numeric: true
  scope: character
  timing: 3             # 回合开始
  duration: permanent
  memo: "回合开始恢复 N 点生命"

- id: jia_dun_status
  name: 架盾
  kind: buff
  numeric: false
  scope: character
  timing: 9             # 攻击声明：目标选择
  duration: conditional # 仅当前军时生效
  memo: "敌方必须先攻击它"

- id: xian_gong_status
  name: 先攻
  kind: buff
  numeric: false
  scope: character
  timing: 12            # 伤害结算：先攻判定
  duration: permanent
  memo: "先结算伤害"

- id: qi_xi_status
  name: 奇袭
  kind: buff
  numeric: false
  scope: character
  timing: 9             # 攻击声明：目标选择
  duration: until_consumed   # 攻击后失去
  memo: "不能被指定为目标"

- id: sheng_dun_status
  name: 圣盾
  kind: buff
  numeric: false
  scope: character
  timing: 10            # 伤害结算前：免疫判定
  duration: until_consumed
  memo: "免疫一次伤害"

- id: hu_jia
  name: 护甲
  kind: buff
  numeric: true
  scope: lord
  timing: 11            # 伤害结算前：护甲吸收
  duration: permanent
  memo: "吸收伤害，永久保留"

# ---------- 减益 ----------

- id: zhen_she
  name: 震慑
  kind: debuff
  numeric: false
  scope: character
  timing: 8             # 攻击声明：合法性检查
  duration: turns
  memo: "不能普通攻击，也不能使用主动技"

- id: hun_luan
  name: 混乱
  kind: debuff
  numeric: false
  scope: character
  timing: 9             # 攻击声明：目标选择
  duration: turns
  memo: "普攻与主动技的目标在合法目标中随机"

- id: zhong_du
  name: 中毒
  kind: debuff
  numeric: true
  scope: character
  timing: 20            # 回合结束
  duration: permanent
  memo: "回合结束时失去 N 点生命"

- id: xu_ruo
  name: 虚弱
  kind: debuff
  numeric: true
  scope: character
  timing: 13            # 伤害结算：攻击力修正
  duration: turns
  memo: "攻击 −N"

- id: duan_liang
  name: 断粮
  kind: debuff
  numeric: true
  scope: lord
  timing: 1             # 回合开始：统率上限
  duration: turns
  memo: "统率值上限 −N"

# ---------- ADR-034 新增：能力驱动的状态 ----------
# caps 字段声明该状态**具体阻断什么**，引擎只查能力、不认状态 id。

- id: jin_yong
  name: 禁用
  kind: debuff
  numeric: false
  scope: character
  timing: 8             # 攻击声明 / 技能使用：合法性检查
  duration: turns
  caps: [block_skill]
  memo: "持续时间内不能使用主动技与触发技（silence）"

- id: mian_yi
  name: 免疫
  kind: buff
  numeric: false
  scope: character
  timing: 10            # 伤害结算前：免疫判定
  duration: turns
  caps: [immune_debuff, untargetable]
  memo: "持续时间内免疫负面状态，且不能被指定为目标"

- id: fan_mian
  name: 翻面
  kind: debuff
  numeric: false
  scope: character
  timing: 9             # 攻击声明：目标选择
  duration: conditional # 需特定条件翻回正面
  caps: [block_action, untargetable]
  memo: "翻面期间无法行动也不能被选中；翻回正面后下回合才能行动"

# ---------- 引擎内部标记（ADR-060） ----------
# 以下 7 个状态由 core 引擎在结算过程中写入/读取，用于表达"这个单位当前处于
# 某种被规则关注的情形"。它们的**概念**来自手写稿或既有卡牌文案，但**名字是
# 实现期起的内部标识**，设计者从未逐条命名 —— 故不作为可被卡牌引用的设计状态，
# 只保证日志与卡面能显示中文。新增卡牌引用它们之前请先找设计者确认。

- id: zhen_wang
  name: 阵亡
  kind: debuff
  numeric: false
  scope: character
  timing: 20            # 阵亡结算
  duration: permanent
  caps: [dead]
  memo: "引擎内部：阵亡标记（供亡语与结算判定）"

- id: shou_hu
  name: 守护
  kind: buff
  numeric: false
  scope: character
  timing: 10            # 伤害结算前：转移判定
  duration: turns
  caps: [redirect_damage]
  memo: "引擎内部：把指向友方主将的伤害转由本单位承担"

- id: duan_chou
  name: 断抽
  kind: debuff
  numeric: false
  scope: lord
  timing: 2             # 回合开始：抽牌
  duration: turns
  caps: [block_draw]
  memo: "引擎内部：该方本回合不能抽牌"

- id: jin_yan
  name: 进言
  kind: buff
  numeric: false
  scope: lord
  timing: 2             # 回合开始：抽牌
  duration: turns
  memo: "引擎内部：该方回合开始额外抽牌"

- id: can_mou
  name: 参谋
  kind: buff
  numeric: false
  scope: character
  timing: 9             # 攻击声明
  duration: turns
  memo: "引擎内部：本单位可执行谋略类行动"

- id: jue_dou
  name: 决斗
  kind: debuff
  numeric: false
  scope: character
  timing: 9             # 攻击声明
  duration: turns
  caps: [forced_attack]
  memo: "引擎内部：本单位被强制攻击指定目标"

- id: chou_di
  name: 仇敌
  kind: debuff
  numeric: false
  scope: character
  timing: 9             # 攻击声明
  duration: turns
  memo: "引擎内部：本单位被标记为某人的仇敌"
