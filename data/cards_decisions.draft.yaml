    count: 1
    to: board
    target:
      side: enemy
  shu_pangtong_aura: []
  event_shichangshi:
  - action: apply_status
    status: duan_liang
    stacks: 2
    target:
      side: enemy
      lord: true
  event_zainian:
  - action: apply_status
    status: duan_chou
    duration: 1
    target:
      side: both
      lord: true
  tactic_caochuanjiejian:
  - action: force_attack
    count: 2
    target:
      side: enemy
      filter:
        type: character
      count: 2
      mode: choose
  - action: apply_status
    status: zhen_wang
