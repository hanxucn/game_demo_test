# 酒令（docs/gdd/11-events-tactics-jiuling.md §3）
#
# 开局双方各选 1 个（三选一），整局持续生效，双方可见。
# 每个酒令都必须有代价或限制——否则会出现"唯一最优解"。
#
# hook 是引擎里已实现的 4 个挂载点（core/src/jiuling.ts）：
#   cost_discount  出牌费用修正（可按类型/每回合次数限定）
#   draw_extra     抽牌后追加「多抽 N 再弃 M」
#   damage_reduce  受伤减免（每回合前 N 次）
#   deck_inject    开局注入一张卡，并设定最早可用回合
#
# 在 hook 形状内新增酒令 = 只改本文件，不改代码。

- id: jiuling_wenjiu
  name: 温酒斩华雄
  hook: cost_discount
  cost: -1
  limit_per_turn: 1
  filter: { type: general }
  memo: "每回合第一张武将 −1 费"
  tradeoff: "只惠及武将，且前期才有意义——后期手里未必有武将"
  implemented: true

- id: jiuling_duijiu
  name: 对酒当歌
  hook: draw_extra
  extra: 1
  discard: 1
  limit_per_turn: 1
  memo: "每回合首抽多抽 1 张，再弃 1 张"
  tradeoff: "多抽一张但必须弃牌——过牌不赚手牌数，只赚选择"
  implemented: true

- id: jiuling_qingmei
  name: 青梅煮酒
  hook: damage_reduce
  reduce: 1
  limit_per_turn: 1
  memo: "每回合第一次受到的伤害 −1"
  tradeoff: "只挡小伤害，面对高攻收益有限"
  implemented: true

- id: jiuling_zhujiu
  name: 煮酒论英雄
  hook: deck_inject
  inject: elite
  unlock_turn: 5
  memo: "开局获得一张本阵营史诗卡，第 5 回合起可用"
  tradeoff: "前期少一张有效牌（手牌被占一格），第 5 回合才回本"
  implemented: true
