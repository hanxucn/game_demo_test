    value: 4
    target:
      side: enemy
      lord: true
  shu_masu:
  - action: draw
    value: 2
  - action: discard
    count: 2
    target:
      side: self
  shu_jianyang:
  - action: return_to_hand
    chance: 0.5
    target:
      side: enemy
      filter:
        type: character
        cost_max: 3
      count: 1
      mode: choose
  tactic_jijiang:
