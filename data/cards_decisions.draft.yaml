    effects:
    # ① 本回合没行动 → 全体 1 伤（ADR-074：新增 acted_this_turn 条件）
    - action: damage
      value: 1
      target:
        side: enemy
        filter:
          type: character
        count: all
      condition:
        acted_this_turn: false
    # ② 行动过且造成过伤害 → 弃掉对方牌库一张（ADR-074：新增 mill 动作）
    # ③ 场上只剩司马懿 → ②同样生效（ADR-074：新增 any_of 条件组合）
    - action: mill
      count: 1
      target:
        side: enemy
      condition:
        any_of:
        - acted_this_turn: true
          dealt_damage_this_turn: true
        - count:
            selector:
              side: ally
              filter:
                type: character
            op: '=='
            value: 1
