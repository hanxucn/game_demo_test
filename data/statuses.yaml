# 状态定义
# 详见 docs/gdd/10-skills-statuses.md §3
#
# 字段说明：
#   id          唯一标识
#   name        显示名（≤4 字）
#   kind        buff | debuff
#   numeric     是否数值型（true = 按层数累加；false = 标志型，不叠加）
#   scope       character | lord | both
#   timing      结算时机（对应 docs/gdd/10-skills-statuses.md §4 的时机编号）
#   duration    permanent | turns | until_consumed | conditional
#   memo        一句话说明

# ---------- 增益 ----------

