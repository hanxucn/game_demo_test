note: '关键词表 —— 定义由设计者逐条给出（ADR-054，2026-09-12）。

  手写稿里出现过、且设计者已定义的关键词如下；未在此列的一律不是本作关键词。'
keywords:
- id: jia_dun
  name: 架盾
  type: buff
  grants:
  - jia_dun_status
  stackable: false
  value: -1
  implemented: true
  definition: 嘲讽：敌方普通攻击必须先打它。是主将唯一的盾牌（单排后）。
  memo: 敌方必须先打它（ADR-051）
- id: xian_gong
  name: 先攻
  type: buff
  grants:
  - xian_gong_status
  stackable: false
  value: -1
  implemented: true
  definition: 入场当回合即可攻击。设计者裁定「疾行 = 先攻」，两者是同一个关键词，已合并为「先攻」。
  memo: 下了就能打
  open: ⚠️ 引擎里另有「击杀则不遭反击」的旧理解，含义待设计者确认（Q-06-1）
- id: lian_ji
  name: 连击
  type: buff
  grants: []
  stackable: false
  value: -1.5
  implemented: true
  definition: 当前回合普通攻击可执行两次。
  memo: 一回合打两下
- id: yi_ji
  name: 遗计
  type: buff
  grants: []
  stackable: false
  value: -2
  implemented: true
  definition: 类亡语：阵亡时触发该卡定义的 on_death 逻辑。
  memo: 死了还要拉一个
- id: yin_xue
  name: 饮血
  type: buff
  grants: []
  stackable: false
  value: -1
  implemented: false
  definition: 对敌人造成的伤害，为自己恢复一定数量生命。
  memo: 打多少回多少
  open: 待实现；且「为自己」是指该单位自身还是己方主将，待设计者确认（Q-06-2）
- id: wu_sheng
  name: 武圣
  type: buff
  grants:
  - wu_sheng_status
  stackable: false
  value: -1
  implemented: true
  definition: 免疫一次伤害。
  memo: 挡一刀
- id: shen_she
  name: 神射
  type: buff
  grants: []
  stackable: false
  value: -1
  implemented: false
  definition: 对随机敌人造成远程伤害，且不受对方攻击影响。
  memo: 隔空点名
  open: 待实现（弓兵「射箭」是它的具体化：回合结束随机打敌方人物或主将 1 点，可绕过架盾）
- id: qi_xi
  name: 奇袭
  type: buff
  grants:
  - qi_xi_status
  stackable: false
  value: -1
  implemented: false
  definition: 上场先隐身（不能被选定）；下个回合可选择行动攻击，只要执行过行动，隐身状态就消失。
  memo: 先藏一回合再出手
  open: 待实现（现引擎只做了"攻击后失去"，缺"上场自动隐身"）
- id: zhong_yi
  name: 忠义
  type: buff
  grants: []
  stackable: false
  value: -1
  implemented: false
  definition: 免疫混乱、离间等状态。
  memo: 不吃控制
  open: 待实现。⚠️ 原引擎误把「忠义」做成"阵亡触发亡语"，已纠正——亡语是「遗计」
- id: jie_zhen
  name: 结阵
  type: buff
  grants: []
  stackable: false
  value: 0
  implemented: false
  definition: ⚠️ 设计者尚未设计具体机制，先保留名字，后续再定。
  memo: （待设计）
  open: 引擎里现存的"相邻有友方步兵时 +1 攻"是 AI 旧推定，**不可用**（Q-06-3）
retired:
- id: ji_xing
  name: 疾行
  reason: 与「先攻」是同一个东西（设计者裁定），已合并 → 请改用 xian_gong
- id: wu_shuang
  name: 无双
  reason: 设计者：暂时没有这个状态
forbidden_combos:
- - jia_dun
  - qi_xi
open_questions:
- id: Q-06-1
  q: 「先攻」的确切含义：入场当回合即可攻击，还是击杀则不遭反击？（引擎两种都有）
  owner: 策划
- id: Q-06-2
  q: 「饮血」恢复给谁：该单位自身，还是己方主将？
  owner: 策划
- id: Q-06-3
  q: 「结阵」的具体机制
  owner: 策划
