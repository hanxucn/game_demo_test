  tactic_chenhuodajie:
  # ADR-073：原先只翻译了「抽对手一张牌」，「使其随机攻击己方单位」整句被漏掉 ——
  # 一张 5 费卡只干了 1 费的事。`force_attack` 的实现正是"令目标立刻攻击其随机友方"。
  - action: force_attack
    condition:
      exists:
        side: enemy
        filter:
          has_status: hun_luan
    target:
      side: enemy
      filter:
        has_status: hun_luan
      count: all
