<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酒话三国 · 卡组</title><style>
:root{color-scheme:dark;--bg:#171817;--panel:#242522;--line:#4e5048;--muted:#a3a79c;--gold:#d5b16a;--ok:#8dca9e;--bad:#e38a7d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#384033,#171817 55%);font:14px/1.4 system-ui,"Microsoft YaHei",sans-serif;color:#eee}.app{max-width:1240px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}.top h1{margin:0;font-size:24px;color:var(--gold)}.top span{color:var(--muted)}button,select,input{font:inherit;color:inherit;background:#30322e;border:1px solid var(--line);border-radius:4px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:var(--gold)}button:disabled{opacity:.42;cursor:not-allowed;border-color:var(--line)}button.primary{background:#72562a;border-color:#bd9855}.bar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}.bar label{color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 380px;gap:16px}.panel{background:rgba(36,37,34,.94);border:1px solid var(--line);border-radius:6px;padding:14px}.panel h2{font-size:16px;margin:0 0 12px;color:var(--gold)}.filters{display:flex;gap:8px;margin-bottom:12px}.filters input{flex:1}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;max-height:650px;overflow:auto}.card{border:1px solid #55584e;border-radius:4px;padding:10px;background:#2c2e2a;display:flex;flex-direction:column}.card.off{opacity:.4}.cardhead,.deckrow,.cardfoot{display:flex;justify-content:space-between;gap:8px}.name{font-weight:700}.card-tags{display:flex;gap:5px;margin-top:7px}.card-tag{padding:2px 7px;border:1px solid #676a60;border-radius:3px;background:#373a34;color:#d8dbd1;font-size:11px;line-height:1.4}.card-tag.faction{border-color:#8c7040;background:#493b25;color:#eed59e}.card-details{display:flex;align-items:flex-end;gap:8px;min-height:52px;margin:7px 0}.desc{flex:1;color:var(--muted);font-size:12px;line-height:1.45}.stats{display:flex;flex:0 0 auto;gap:5px}.stat{min-width:32px;padding:4px 5px;border:1px solid #5d6057;border-radius:3px;background:#222420;text-align:center;font-size:12px;font-weight:700}.stat.attack{color:#f0c46e}.stat.health{color:#ef9088}.owned{color:var(--muted);font-size:12px}.cardfoot{align-items:center;margin-top:auto}.card button{padding:4px 8px}.deckhead{display:flex;justify-content:space-between;align-items:center}.count{color:var(--ok);font-weight:700}.decklist{min-height:400px;max-height:560px;overflow:auto}.deckrow{padding:8px 0;border-bottom:1px solid #3c3e39}.deckrow .actions{white-space:nowrap}.deckrow button{padding:2px 7px}.deck-card-info{color:var(--muted);font-size:12px}.summary{color:var(--muted);margin-top:12px}.notice{min-height:22px;margin-top:10px}.notice.bad{color:var(--bad)}.notice.ok{color:var(--ok)}.saved{margin-top:16px}.savedrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #3c3e39}.saved-name{min-width:0;overflow-wrap:anywhere}.saved-actions{display:flex;flex:0 0 auto;gap:6px}.saved-actions button{padding:4px 8px}.saved-actions .danger{border-color:#87534c;color:#f0a097}.saved-actions .danger:hover{border-color:var(--bad);background:#4a2c29}.empty{color:var(--muted);padding:20px 0}@media(max-width:850px){.app{padding:12px}.layout{grid-template-columns:1fr}.decklist{max-height:none}}
</style></head><body><main class="app"><div class="top"><h1>《酒话三国》卡组构筑</h1><span>Demo 用户 · 数据保存到 SQLite</span><a href="card-test.html" style="margin-left:auto;color:var(--ok)">卡牌测试</a></div><div class="bar"><label>阵营</label><select id="faction"><option value="shu">蜀</option><option value="wei">魏</option><option value="wu">吴</option></select><input id="deck-name" value="我的卡组" maxlength="32"><button id="new">新建</button><button id="save" class="primary">保存卡组</button><span id="status"></span></div><div class="layout"><section class="panel"><h2>可用卡牌</h2><div class="filters"><input id="search" placeholder="搜索名称或 ID"><select id="type"><option value="">全部类型</option><option value="troop">兵种</option><option value="general">武将</option><option value="strategist">谋臣</option><option value="tactic">战法</option><option value="event">事件</option></select></div><div id="cards" class="cards"></div></section><aside class="panel"><div class="deckhead"><h2>当前卡组</h2><span id="count" class="count">0 / 30</span></div><div id="deck" class="decklist"></div><div id="summary" class="summary"></div><div id="saved" class="saved"></div></aside></div></main><script src="deck-builder.js"></script></body></html>
