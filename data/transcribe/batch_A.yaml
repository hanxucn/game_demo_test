# 转录约定：
#   1) 只转录照片上真实可见的笔迹，不补全、不改写、不润色。
#   2) 无法辨认的字用 【?】 占位，并在 uncertain 里说明可确定的字形。
#   3) skill_text 逐字照抄；原稿换行处不插入任何字符（直接拼接）。
#   4) 原稿的标点（点号「.」「．」）统一转写为「。」；不确定处见 uncertain。
#   5) 数字（统率/攻/血）看不清一律 null，不猜。

