# 关键词定义
# 详见 docs/gdd/06-keywords.md
#
# 字段说明：
#   id        唯一标识（数据文件引用此 id）
#   name      显示名（≤4 字）
#   type      buff | debuff
#   grants    授予的状态 id（可为空）
#   stackable 是否可叠加
#   value     总价值预算中的成本（负值 = 占用预算；null = 视具体效果而定）
#   memo      一句话说明（用于 UI 详情面板）

keywords:
  - id: zhong_yi
    name: 忠义
    type: buff
    grants: []
    stackable: false
    value: null
    memo: "阵亡时触发亡语效果"

  - id: yi_ji
    name: 遗计
    type: buff
    grants: []
    stackable: false
    value: -2
    memo: "阵亡时抽 1 张牌"

  - id: ji_xing
    name: 疾行
    type: buff
    grants: []
    stackable: false
    value: -1.5
    memo: "入场当回合即可攻击"

  - id: jia_dun
    name: 架盾
    type: buff
    grants: [jia_dun_status]
    stackable: false
    value: -1
    memo: "嘲讽：敌方普通攻击必须先打它（ADR-051）"

  - id: wu_sheng
    name: 武圣
    type: buff
    grants: [wu_sheng_status]
    stackable: false
    value: -1
    memo: "免疫一次伤害"

  - id: shen_she
    name: 神射
    type: buff
    grants: []
    stackable: false
    value: -0.5
    memo: "可攻击任意列的人物卡"

  - id: lian_ji
    name: 连击
    type: buff
    grants: []
    stackable: false
    value: -1.5
    memo: "每回合可攻击 2 次"

  - id: yin_xue
    name: 饮血
    type: buff
    grants: []
    stackable: false
    value: -1
    memo: "造成伤害时为主将回复等量生命"

  - id: qi_xi
    name: 奇袭
    type: buff
    grants: [qi_xi_status]
    stackable: false
    value: -1
    memo: "不能被指定为攻击目标，攻击后失去"

  - id: xian_gong
    name: 先攻
    type: buff
    grants: [xian_gong_status]
    stackable: false
    value: -1
    memo: "先结算伤害，目标阵亡则不受反击"

  - id: jie_zhen
    name: 结阵
    type: buff
    grants: []
    stackable: false
    value: -0.5
    memo: "相邻有友方步兵时本次普攻 +1"

  - id: wu_shuang
    name: 无双
    type: buff
    grants: []
    stackable: false
    value: -2
    memo: "攻击时不受到反击伤害"

# 禁止的组合（校验器检查）
forbidden_combos:
  - [jia_dun, qi_xi]     # 架盾要求"必须优先攻击它"，奇袭要求"不能被指定" → 死锁
