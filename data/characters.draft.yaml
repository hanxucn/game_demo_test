# ============================================================
# 人物卡录入区（武将 / 谋臣）—— 集中一个文本
# ============================================================
#
# 工作流（两步）：
#   ① 录入：你在对话里口述一个武将，我把信息**完整录入到本文件**（一个武将一条）。
#   ② 整理：攒够一批后，我把本文件的条目「集中整理」进 data/cards.yaml，
#      再跑数值校验，把每个人的总价值 / 预算报告给你。
#
# 为什么分两步：
#   · data/cards.yaml 是**唯一真源**，直接写它 = 半成品数值会污染构建；
#   · 本文件是草稿区，tools/yaml2json.py 会自动跳过 *.draft.yaml，
#     所以这里写什么都不可能进 core/data/*.json。
#
# 相关文档：
#   · 字段说明    docs/gdd/05-cards.md §2、§5.1
#   · 数值模型    docs/gdd/13-balance-data-model.md（属性点 ≈ 2×统率+1）
#   · 技能 / 状态 docs/gdd/10-skills-statuses.md
#   · 关键词      data/keywords.yaml
#   · 状态        data/statuses.yaml
#
# ------------------------------------------------------------
# 口述最小清单（给我这些就能录）
# ------------------------------------------------------------
#   1. 名字     卡名 ≤4 字（同名多形态用副标题，如「关羽·武圣」）
#   2. 阵营     蜀 shu / 魏 wei / 吴 wu / 群 qun
#   3. 类型     武将 general / 谋臣 strategist（谋臣攻击恒为 0，不能普攻）
#   4. 费用     统率值 0–10
#   5. 攻血     可只说人话；不给的话我按预算补，并标注「我拟」
#   6. 关键词   说人话即可，我映射到 data/keywords.yaml（12 个已注册）
#   7. 技能     说人话即可，我翻成 skills DSL（kind / trigger / target / effects）
#   8. 记忆点   一句话——「它为什么值得被记住」，必填
#   9. 风味     引用或化用演义原文，≤30 字，可选
#  10. 羁绊     可选（data/bonds.yaml 尚是草案）
#
# ------------------------------------------------------------
# 已注册的引用 id（只能从这里选，否则校验报错）
# ------------------------------------------------------------
#   关键词 keywords（12）：
#     zhong_yi 忠义    yi_ji  遗计    ji_xing  疾行    jia_dun  架盾
#     wu_sheng 武圣    shen_she 神射   lian_ji  连击    yin_xue  饮血
#     qi_xi   奇袭    xian_gong 先攻  jie_zhen 结阵    wu_shuang 无双
#     ⚠️ 非法组合：架盾 jia_dun + 奇袭 qi_xi
#
#   状态 status（12）：
#     zhen_fen 振奋  ji_jiu 急救  jia_dun_status 架盾  xian_gong_status 先攻
#     qi_xi_status 奇袭  wu_sheng_status 武圣  hu_jia 护甲（仅主将）
#     zhen_she 震慑  hun_luan 混乱  zhong_du 中毒  xu_ruo 虚弱  duan_liang 断粮
#
#   效果动作 action（14，见 core/src/constants.ts 的 ACTIONS）：
#     damage 伤害        heal 治疗          draw 抽牌        summon 召唤
#     apply_status 施加状态  remove_status 移除状态  move 移动    destroy 消灭
#     modify 修正属性    gain_armor 获护甲   gain_command 获统率
#     cost_modifier 费用修正  transform 变形   random_pick 随机取
#
#   触发时机 trigger：
#     on_play 入场   on_death 阵亡   on_damaged 受伤   turn_start 回合开始
#     turn_end 回合结束  on_attack 攻击时  on_defend 被攻击时
#
# ------------------------------------------------------------
# 单条记录模板
# ------------------------------------------------------------
# - id: shu_xxx              # 阵营前缀_拼音，如 shu_guanyu
#   name: 卡名                # ≤4 字
#   faction: shu              # shu | wei | wu | qun
#   type: general             # general 武将 | strategist 谋臣
#   cost: 0                   # 0–10
#   attack: 0
#   health: 0
#   keywords: []              # 只能填上面 12 个
#   skills: []                # 见下方技能模板
#   bonds: []
#   memo: ""                  # 必填：一句话记忆点
#   flavor: ""                # 可选
#   # ---- 录入元信息（整理进 cards.yaml 时删除）----
#   _meta:
#     source: 口述            # 口述 | 我拟 | 文档
#     date: "2026-09-11"      # ⚠️ 必须加引号：裸日期会被 YAML 解析成日期对象，json 序列化会崩
#     status: 待整理          # 待整理 | 待确认 | 已整理
#     open: []                # 未定项，如「费用待定」「技能数值待测」
#
# ------------------------------------------------------------
# 技能模板（docs/gdd/10-skills-statuses.md §2）
# ------------------------------------------------------------
#   skills:
#     - id: caochuan          # 拼音 snake_case
#       name: 草船借箭         # ≤4 字
#       kind: active          # active 主动 | trigger 触发 | aura 光环
#       cost: 2               # 仅 active，0–3
#       frequency: once_per_turn   # once_per_turn | unlimited | once
#       trigger: on_play      # 仅 trigger 需要
#       target:               # 选择器
#         side: ally          # ally | enemy | both | self
#         filter: { type: strategist }
#         count: 1            # 数字 或 all
#         mode: choose        # choose | random | first | lowest_health
#       effects:
#         - action: draw
#           value: 2
#
# ============================================================
# 录入示例（**仅供参考格式，不是已定数据**，取消注释即可复用）
# ============================================================
#
# - id: shu_guanyu
#   name: 关羽
#   faction: shu
#   type: general
#   cost: 6
#   attack: 5
#   health: 5
#   keywords: [wu_sheng]
#   skills: []
#   bonds: []
#   memo: "免疫一次伤害，站场久攻不下"
#   flavor: "身长九尺，髯长二尺；丹凤眼，卧蚕眉。"
#   _meta:
#     source: 示例
#     status: 待确认
#     open: [数值是否照 6 费基准, 是否给「忠义」亡语]

# ============================================================
# 以下为已录入条目
# ============================================================

