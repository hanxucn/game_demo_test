card_type:
  # ADR-072：ADR-018 的定型规则（攻击 > 1 → 武将）是在**照片稿**上跑的，
  # 而攻击力后来被 card_stats 改过 —— 于是出现"数值改了、类型没跟着改"的静默错误。
  # 这里按卡 id 覆盖**最终**类型；`explicit: true` 表示"1 攻也算武将"是设计者的显式裁定，
  # 而不是由规则推出来的（校验器会把没标注的 1 攻武将判为 error）。
  shu_huangquan:
    type: strategist
    reason: 照片稿（#85）缺攻击力，ADR-018 判不出类型，早年由 gen-cards-v1 的 TYPE_FIX 硬编码成武将；
      黄权史实身份为文臣/谋臣、且攻击 ≤ 1 → 定型为谋臣（ADR-072 去掉该硬编码）
  shu_xiangchong:
    type: strategist
    reason: ADR-068 把向宠改成 2 费 1/4（原 2 费 2/3）。攻击 ≤ 1 且**无**设计者显式标注武将
      → 按 ADR-018 的默认取谋臣（照片层的「武将」只是当时按攻击 2 推出来的，已失效）
  wei_caogang:
    type: general
    explicit: true
    reason: type_overrides photo 113「设计者答疑：曹昂 1 攻 3 血，定为武将」——显式覆盖 ADR-018
  qun_zhangbao:
    type: general
    explicit: true
    reason: 张宝 1 攻 2 血；照片层按「演义身份为武将」判定，属显式判定而非攻击力推导
