meta:
  updated: '2026-09-11'
  source: 设计者口头决策（第二轮）
rules:
  cost_max:
    value: 10
    adr: ADR-016
    memo: 费用上限 10。超出者已按强度下调。
  strategist_attack:
    adr: ADR-015
    status: 已定
    memo: '谋臣**不强制 0 攻**，但**默认上限 1 攻**。 定型规则（ADR-018）：攻击 > 1 → 武将；攻击 ≤ 1 且史实身份为谋臣/非武将 → 谋臣。 需同步修改：docs/gdd/05-cards.md §2 与 core/tools/validate.ts 规则⑤。

      '
    value: 默认上限 1 攻
  terminology:
    adr: ADR-019
    memo: '以项目术语为标准，原稿用词保留在 skill_text 里、整理时归一： 「统帅」→「统率」（代表费用）、「己放」→「己方」、「计能」→「技能」。 「概率」与「几率」都可用，不构成误解。

      '
  blank_stat_mark:
    adr: ADR-020
    memo: '数字与「攻」「血」之间夹的连笔字是**当时的修改笔误**，不是数值内容。 下方「攻」即攻击力、「血」即生命值，直接取数字即可。

      '
  box_line_not_digit:
    adr: ADR-021
    memo: '有的卡把统率值画在方框里，**框的左边线是单独一竖笔，不是数字「1」**。 例：#149 出其不意 = 4 费（不是 14）。据此 #153/#158 = 4、#157 = 3。

      '
